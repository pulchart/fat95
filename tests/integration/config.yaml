# Settings of run.py. os names the OS profiles, the image brings the OS. A
# relative path starts at the repository root. fat95, dd, lsfsres, debug95
# and ptable default to this repository's dist/.
---
os:
  # the local AmigaOS images as an A1200 and as an A600 with the 68000 builds
  "3.2.3-a1200":
    model: A1200
  "3.1-a1200":
    model: A1200
  "3.2.3-a600":
    model: A600
    cpu: "68000"
    tier: "68000"
  "3.1-a600":
    model: A600
    cpu: "68000"
    tier: "68000"
  aros:
    setpatch: false
    cpu: 68040-NOMMU
    ide_device: ata.device
    stack: 65536
    copy: dd
  apolloos:
    setpatch: false
    cpu: 68040-NOMMU
    ide_device: uaehf.device
    ide_unit: 1
    stack: 65536
    copy: dd
