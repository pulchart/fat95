# Settings of run.py. os names the OS profiles, the image brings the OS. A
# relative path starts at the repository root. fat95, dd, lsfsres, debug95
# and ptable default to this repository's dist/.
---
os:
  "3.2.3": {}
  "3.1": {}
  aros:
    setpatch: false
    cpu: 68040-NOMMU
    ide_device: ata.device
    stack: 65536
    copy: dd
  apolloos:
    setpatch: false
    cpu: 68040-NOMMU
    ide_device: uaehf.device
    ide_unit: 1
    stack: 65536
    copy: dd
# FileSystemStressTest from Aminet (disk/misc), for the stress_ scenarios
fsst: /opt/AmigaOS/FileSystemStressTest/FileSystemStressTest
# work: build/integration
# fsuae: fs-uae
# wait: 5
# limit: 240
